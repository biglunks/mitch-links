<script>
(function(){
const SELF = document.currentScript.textContent;
const FONTS = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap">';
const RESET_FALLBACK = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex = v => /^#[0-9a-f]{6}$/i.test(v||"") ? v : null;
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "item";
const domainOf = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch(e) { return String(u||"").replace(/^https?:\/\//,"").replace(/^www\./,"").split("/")[0]; } };
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : (u ? "https://" + u : "#");

const saved = JSON.parse(document.getElementById("links-data").textContent);
let data = JSON.parse(JSON.stringify(saved));   // what the page shows (the draft while editing)
let active = "all";
try { active = localStorage.getItem("ml-filter") || "all"; } catch(e) {}

/* ---------- page shell ---------- */
$("#app").innerHTML = `
<div class="wrap">
  <div class="topbar"><button class="login" id="login">Admin login</button><p class="note" id="note" hidden role="status"></p></div>
  <header>
    <h1>Mitch<br><span>Links</span></h1>
    <p class="lede">These are the apps and sites I actually use, all the time. No ads, no randoms, just my real list.</p>
    <p class="pitch"><b>You get a bonus. I get a bonus.</b> Most of these companies pay both people when you sign up with a friend's referral link. If you were going to sign up anyway, use mine. It's free money for both of us.</p>
    <p class="fine">These are referral links, so I may get a bonus when you sign up. Each company sets its own bonus and terms.</p>

</div>
<aside class="drawer" id="drawer" hidden aria-label="Edit links"></aside>`;

/* ---------- public view ---------- */
function snippet(l){
  const accent = hex(l.accent) || "#111111", bg = hex(l.bg) || "#FFFFFF", fg = hex(l.fg) || "#111111";
  const btnText = accent.toUpperCase() === "#FFFFFF" ? bg : "#FFFFFF";
  const logoColor = accent.toUpperCase() === fg.toUpperCase() || accent.toUpperCase() === "#FFFFFF" ? fg : accent;
  return `<a class="snip" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener" aria-label="Open ${esc(l.name)}">
    <div class="bar"><i></i><i></i><i></i><span class="url">${esc(domainOf(l.url))}</span></div>
    <div class="hero" style="background:${bg};color:${fg}">
      <div class="nav"><span class="logo" style="color:${logoColor}">${esc(String(l.name).toLowerCase())}</span><s></s><u></u><u></u><b style="background:${accent};color:${btnText}">Sign up</b></div>
      <div class="big">${esc(l.headline || l.name)}</div>
      <div class="lines"><u style="width:90%"></u><u style="width:65%"></u></div>
    </div></a>`;
}
function card(l){
  const code = l.code
    ? `<button class="copy mini" id="copy-${esc(l.id)}" data-code="${esc(l.code)}">Copy code</button>`
    : `<span class="nocode">No code needed. The link does it.</span>`;
  return `<article class="card">${snippet(l)}
    <div class="info">
      <h3 class="name">${esc(l.name)}${l.example ? '<span class="tag">EXAMPLE</span>' : ''}</h3>
      ${l.what ? `<p class="what">${esc(l.what)}</p>` : ''}
      ${l.perk ? `<p class="perk">${esc(l.perk)}</p>` : ''}
      <div class="actions">${code}</div>
    </div>
    <div class="codebox"><a class="cta" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener" data-code="${esc(l.code || "")}">${esc(l.name)}${l.code ? ` / <span class="c">${esc(l.code)}</span>` : ""}</a><span class="dom">${esc(domainOf(l.url))}</span></div></article>`;
}
function render(){
  const cats = data.categories;

/* ---------- confetti on copy ---------- */
function confetti(el){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let cv = document.getElementById("confetti");
  if (!cv) { cv = document.createElement("canvas"); cv.id = "confetti"; cv.setAttribute("aria-hidden", "true"); document.body.appendChild(cv); }
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = el.getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
  const colors = ["#FFD23F", "#2340D9", "#FF5B3A", "#5BE0A4", "#111111", "#FF4F8B"];
  const bits = Array.from({ length: 90 }, () => {
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.4, v = 6 + Math.random() * 9;
    return { x: x0, y: y0, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 6 + Math.random() * 6, h: 4 + Math.random() * 8,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: colors[Math.random() * colors.length | 0], round: Math.random() < .25 };
  });
  const t0 = performance.now();
  cancelAnimationFrame(confetti.raf);
  (function frame(t){
    const life = (t - t0) / 1400;
    ctx.clearRect(0, 0, W, H);
    if (life >= 1) { ctx.clearRect(0, 0, W, H); return; }
    ctx.globalAlpha = life > .7 ? 1 - (life - .7) / .3 : 1;
    for (const p of bits) {
      p.vy += .35; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    confetti.raf = requestAnimationFrame(frame);
  })(t0);
}

$("#drawer").addEventListener("click", async e => {

  if (id === "add") { editingId = "__new"; $("#drawer")._new = blankLink(); renderDrawer(); $("#f-name").focus(); return; }
  if (id === "cancel") { editingId = null; renderDrawer(); return; }
  if (act === "edit") { editingId = data.links[i].id; renderDrawer(); $("#form").scrollIntoView({block:"start"}); return; }
  if (act === "up" || act === "down") {
    const j = act === "up" ? i - 1 : i + 1; const L = data.links; [L[i], L[j]] = [L[j], L[i]]; markDirty(); return;
  }
  if (act === "del") {
    if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Sure?"; setTimeout(() => { if (t.isConnected) { t.classList.remove("armed"); t.textContent = "Delete"; } }, 3000); return; }
    const gone = data.links.splice(i, 1)[0]; if (editingId === gone.id) editingId = null; pruneCategories(); markDirty(); return;
  }
  if (id === "apply") {
    const f = readForm(); if (f.error) { $("#msg").textContent = f.error; $("#msg").className = "msg err"; return; }
    if (editingId === "__new") {
      let nid = slug(f.name), n = 2; while (data.links.some(l => l.id === nid)) nid = slug(f.name) + "-" + n++;
      data.links.push({ id: nid, ...f });
    } else {
      const l = data.links.find(x => x.id === editingId); Object.assign(l, f);
    }
    editingId = null; pruneCategories(); markDirty(); return;

  if (id === "autofill") return autofill(t);

async function ask(){
  askText = ($("#ask-text").value || "").trim();

  askBusy = true; askSaid = ""; renderDrawer();
  const current = { categories: data.categories, links: data.links.map(({id, ...rest}) => ({id, ...rest})) };
  const prompt = `You manage the data for Clay's personal page of referral and affiliate links ("Mitch Links"). Friends visit it to copy his codes.
Here is the current data as JSON:
${JSON.stringify(current)}

Clay's request:
"""${askText}"""

Apply the request and return ONLY a JSON object: {"categories": [...], "links": [...], "summary": "..."}.
Rules:
- Keep every link and category the request doesn't touch exactly as it is, in the same order.
- Each link has: id (short lowercase slug, unique), cat (a category id), name, url (full https URL), what (one short casual first-person sentence), perk (short, or ""), code (the referral code, or "" if none), example (false for anything Clay adds or edits), headline (short tagline in the style of the product's homepage, max 40 chars), bg, fg, accent (#RRGGBB colors approximating the product's website header background, header text, and brand/button color).

    if (!r || !Array.isArray(r.links) || !Array.isArray(r.categories) || !r.links.every(okLink)) throw { code: "bad_shape" };
    const seen = new Set();
    const links = r.links.map(l => {
      let id = slug(l.id || l.name); while (seen.has(id)) id += "-2"; seen.add(id);
      return { id, cat: slug(l.cat), name: String(l.name), url: String(l.url || ""), what: String(l.what || ""), perk: String(l.perk || ""),

  } catch (err) {

Return ONLY a JSON object with these keys:

  btn.disabled = true; btn.textContent = "Saving…";
  const d = new Date();
  data.updated = d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  dirty = false;
  try {
    await artifactApi.publish(buildDoc(data));
    $("#msg").textContent = "Saved. The page is reloading with your changes."; $("#msg").className = "msg ok";
  } catch (err) {
    const code = err && err.code;
    const m = code === "conflict" ? "A newer version was saved somewhere else, so the page is reloading to it. Make your change again after it loads."
      : (code === "not_writer" || code === "not_granted" || code === "consent_required") ? "This view can't save. Open the page while signed in to your own Claude account."
      : code === "rate_limited" ? "Saving too often. Wait a minute, then save again."
      : code === "too_large" ? "The page got too big to save. Remove a few links and try again."
      : "Saving didn't go through. Try again in a moment.";
    $("#msg").textContent = m; $("#msg").className = "msg err";
    if (code !== "conflict") dirty = true;
    btn.disabled = false; btn.textContent = "Save and publish";
  }
}

let adminCheck = null;
if (!window.claude) $("#login").hidden = true;   // on the public website (outside Claude) there is no editor
$("#login").addEventListener("click", async () => {
  const note = $("#note");
  note.hidden = false; note.textContent = "Checking your account…";
  const ok = await (adminCheck || Promise.resolve(false));
  if (ok) { note.hidden = true; $("#drawer").hidden = false; renderDrawer(); return; }
  note.textContent = "Only Clay can edit this page. Open it in the Claude app or on claude.ai while signed in to Clay's account.";
  setTimeout(() => { note.hidden = true; }, 6000);
});
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

adminCheck = (async () => {
  if (!window.claude || !claude.use) return false;
  const user = await claude.use("user");
  const canEdit = user ? await user.canEdit() : false;
  if (!canEdit) return false;
  artifactApi = await claude.use("artifact");
  if (!artifactApi) return false;
  sampleApi = await claude.use("sample");
  return true;
})().catch(() => false);
})();
</script>
